<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tendiz Property - Find your unit</title>
<meta name="description" content="Browse available units, filter by budget, bedrooms, compound and delivery. Chat with me on WhatsApp.">
<meta property="og:title" content="Tendiz Property">
<meta property="og:description" content="Find a unit that fits your budget.">
<meta name="theme-color" content="#1d2f1f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="./" aria-label="Tendiz Property"><img src="img/logo-cream.png" alt="Tendiz" width="110" height="34"></a>
  <a class="wa-link" id="top-wa" href="#">WhatsApp</a>
</div></header>

<section class="filters"><div class="wrap">
  <h1 id="heading">Find your unit</h1>
  <form id="f" class="grid-f" onsubmit="return false">
    <div class="field"><label for="budget">Max budget</label>
      <select id="budget"></select></div>
    <div class="field"><label for="beds">Bedrooms</label>
      <select id="beds"><option value="">Any</option><option value="1">1</option><option value="2">2</option>
        <option value="3">3</option><option value="4">4+</option></select></div>
    <div class="field"><label for="compound">Compound</label>
      <select id="compound"><option value="">All compounds</option></select></div>
    <div class="field"><label for="delivery">Delivery</label>
      <select id="delivery"><option value="">Any</option><option value="ready">Ready to move</option>
        <option value="offplan">Off-plan</option></select></div>
  </form>
  <div class="bar">
    <span class="count" id="count" aria-live="polite"></span>
    <div class="btns">
      <button class="btn small" id="reset" type="button">Reset</button>
      <button class="btn small primary" id="share" type="button">Share this search</button>
    </div>
  </div>
</div></section>

<main class="wrap">
  <div class="cards" id="cards"></div>
</main>
<noscript><p class="wrap">Please enable JavaScript to browse units.</p></noscript>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
